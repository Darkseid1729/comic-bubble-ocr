name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'Darkseid1729' and 'comic-bubble-ocr' if your Space has a different username/slug
          git push --force https://Darkseid1729:$HF_TOKEN@huggingface.co/spaces/Darkseid1729/comic-bubble-ocr main
